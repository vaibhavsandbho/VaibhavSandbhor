spring:
  application:
    name: BATTERY

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  datasource:
    alarm:
      url: jdbc:postgresql://localhost:5432/ats_mahindra_db
      username: postgres
      password: root
      driver-class-name: org.postgresql.Driver

    position:
      url: jdbc:sqlserver://localhost:1433;databaseName=ats_wms_mahindra_electric_db;encrypt=true;trustServerCertificate=true
      username: ats-india
      password: "Ats123*"
      driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 60000   # Optional: timeout in ms

server:
  port: 8090
  servlet:
    connection-timeout: 60s

plc:
  opc-ua:
    enabled: true
    server-url: "opc.tcp://192.168.24.1:4840"   # corrected with colon before 4840
    security-policy: "None"
    username: ""
    password: ""
    connection-timeout: 5000
    max-reconnect-attempts: 3
    reconnect-delay: 5000

# Thread Pool Configuration for OPC-UA operations - AGGRESSIVE LIMITING
executor:
  core-pool-size: 4        # Core threads (reduced from 8)
  max-pool-size: 8         # Maximum concurrent threads (reduced from 16)
  queue-capacity: 50       # Maximum pending tasks (reduced from 100)
  keep-alive-seconds: 30   # Idle thread keep-alive time (reduced from 60)

  tags:
    - name: "Tag1"
      identifier: 
      dataType: Object

    - name: Tag2
      identifier: 
      dataType: Object

    - name: PLC
      identifier: 
      dataType: Object

  telegrams:
    - name: ProductionData
      identifier: "ns=2;s=Telegram_Production"
      dataType: ByteString
      length: 100
      format: Binary
      isArray: true

    - name: MachineStatus
      identifier: "ns=2;s=Telegram_Status"
      dataType: String
      length: 50
      format: ASCII
      isArray: false

    - name: ProcessValues
      identifier: "ns=2;s=Telegram_Process"
      dataType: ByteString
      length: 200
      format: Binary
      isArray: true

  writer:
    enabled: false
    interval: 5000
    node-id: 'ns=3;s="Lumax WMS<>PLC"."STACKER_1_MISSION_PALLET_CODE"'

logging:
  level:
    com.ats.plc: DEBUG
    org.eclipse.milo: INFO

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
